name: Mirror existing Edexcel exam PDFs to this repository
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edexcel-pdf-release-import
  cancel-in-progress: false

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repo with write access
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and upload all accessible Edexcel PDF sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/import_pdf_sources.py
      - name: Commit actual downloadable PDF index to main
        if: always()
        run: |
          if [ ! -f downloads/index.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/README.md downloads/index.json
          if git diff --cached --quiet; then
            echo "No new index changes."
          else
            git commit -m "Publish direct download links for successfully mirrored Edexcel PDFs"
            git fetch origin main
            git pull --rebase origin main
            git push origin HEAD:main
          fi
