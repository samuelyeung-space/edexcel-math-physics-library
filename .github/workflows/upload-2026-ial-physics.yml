name: Publish 2026 Edexcel IAL Physics Unit 1-6 QP/MS PDFs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upload-2026-ial-physics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload 2026 Jan and June physics PDFs for all six units
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import urllib.request

          repo=os.environ["GITHUB_REPOSITORY"]
          def gh(*args):
              return subprocess.run(["gh",*args,"-R",repo],capture_output=True,text=True)
          def get_pdf(item, folder, month, label):
              unit,variant,kind=item
              suffix=f"U{unit}{variant}"
              v="01A" if variant else "01"
              name=f"Edexcel_IAL_Physics_2026_{label}_U{unit}_{v}_{kind}.pdf"
              path=folder/name
              url=f"https://edephy.alevelclouds.com/26_{month}_{kind}_{suffix}.pdf"
              try:
                  rq=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(rq,timeout=45) as r:
                      data=r.read(35*1024*1024)
                  if not data.startswith(b"%PDF-"):
                      return None
                  path.write_bytes(data)
                  return path
              except Exception as e:
                  print("SOURCE UNAVAILABLE",name,str(e)[:140],flush=True)
                  return None

          tasks=[(u,v,k) for u in range(1,7) for v in ("","A") for k in ("QP","MS")]
          with tempfile.TemporaryDirectory() as d:
              folder=Path(d)
              for month,label in (("01","January"),("06","June")):
                  tag=f"pdf-ial-physics-2026-{label.lower()}"
                  with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
                      files=[p for p in pool.map(lambda t:get_pdf(t,folder,month,label),tasks) if p is not None]
                  if not files:
                      continue
                  if gh("release","view",tag).returncode:
                      x=gh("release","create",tag,"--target","main","--title",f"Edexcel IAL Physics {label} 2026 QP and MS PDFs","--notes","Units 1–6; variants 01 and 01A; full question papers and mark schemes.")
                      if x.returncode:raise RuntimeError(x.stderr[:300])
                  done=0
                  for i in range(0,len(files),10):
                      fs=files[i:i+10]
                      x=gh("release","upload",tag,*map(str,fs),"--clobber")
                      if x.returncode==0: done+=len(fs)
                      else:
                          for p in fs:
                              z=gh("release","upload",tag,str(p),"--clobber")
                              if z.returncode==0:done+=1
                              else:print("UPLOAD ERROR",p.name,z.stderr[:160],flush=True)
                  print(label,"PHYSICS UPLOADED",done,"/",len(files),flush=True)
          PY
